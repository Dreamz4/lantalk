name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev
      - name: Configure CMake
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-release -j$(nproc)
      - name: Strip Binary
        run: strip build-release/lantalk
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lantalk-linux-x86_64
          path: build-release/lantalk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-ninja
      - name: Build
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lantalk-windows-x86_64.exe
          path: build/lantalk.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lantalk-linux-x86_64/lantalk
            lantalk-windows-x86_64.exe/lantalk.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
